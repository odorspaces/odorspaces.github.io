name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site files
        run: |
          mkdir -p "${{ runner.temp }}/odorspaces-site"
          cp index.html styles.css script.js media-config.mjs failure-config.mjs .nojekyll googled9774b1172b26e4a.html "${{ runner.temp }}/odorspaces-site/"
          cp -R assets offline "${{ runner.temp }}/odorspaces-site/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ runner.temp }}/odorspaces-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
